# Build the Lokyni desktop app for macOS, Windows, and Linux.
#
# A branch push or pull request runs the unit suite only. A version tag (or a manual run)
# also builds the native installers on each operating system and attaches them to a release.
#
# The app bundles real native modules (the vector index, the local reranker runtime, image
# handling), which cannot be cross-compiled, so each installer is built on its own operating
# system. Dependencies are installed fresh on each runner so the bundled binaries match the
# target platform.

name: Desktop app

on:
  push:
    branches: [master, main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build installers for (for example 1.0.0).'
        required: true

permissions:
  contents: read

env:
  # This exact runtime is copied into the bundle, so it is pinned for reproducibility. Keep it
  # aligned with the version the app is tested against.
  NODE_VERSION: '24.11.1'

jobs:
  # Unit suite on all three platforms. Gates every build.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run the unit suite
        run: npm run test:unit

  # Browser regression suite. Runs Chromium and Firefox against the real server and a local stub
  # provider. Headless, so no display server is needed; the Linux packages cover both engines.
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser runtimes
        run: |
          npx puppeteer browsers install chrome
          npx puppeteer browsers install firefox
      - name: Install Linux browser libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2 libcairo2 libpango-1.0-0 libx11-xcb1 libxcb-dri3-0 libxcb1 \
            libxext6 libxi6 libxrender1 libxss1 libxtst6 fonts-liberation \
            libgtk-3-0 libdbus-glib-1-2 libxt6
      - name: Run the browser suite
        run: npm run test:e2e
      - name: Upload browser-test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results
          if-no-files-found: ignore

  # Build and exercise the server image. A writable state volume must serve /status; a read-only
  # state mount must fail with the actionable permissions message. The static Docker guards run in
  # the unit suite; this job proves the image itself starts.
  docker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate the compose file
        run: docker compose -f docker/docker-compose.yml config --quiet
      - name: Build the image
        run: docker build -f docker/Dockerfile -t lokyni:ci .
      - name: Start with a writable state volume
        run: |
          docker run -d --name lokyni-ci \
            --tmpfs /state:size=768m,uid=1000,gid=1000 \
            --memory 2g \
            -p 127.0.0.1:17887:7887 \
            lokyni:ci
          trap 'docker rm -f lokyni-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:17887/status >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs lokyni-ci
            docker rm -f lokyni-ci
            exit 1
          fi
          docker exec lokyni-ci node /app/docker/healthcheck.js
          docker rm -f lokyni-ci
      - name: Refuse a read-only state mount with guidance
        run: |
          mkdir -p "$RUNNER_TEMP/lokyni-readonly"
          set +e
          docker run --rm --name lokyni-ro             -v "$RUNNER_TEMP/lokyni-readonly:/state:ro"             lokyni:ci > "$RUNNER_TEMP/lokyni-readonly.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/lokyni-readonly.log"
          test "$code" -ne 0
          grep -q "cannot write to its data directory" "$RUNNER_TEMP/lokyni-readonly.log"

  # Build the installers. Only for a version tag or a manual run.
  build:
    needs: [test, e2e, docker]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE macOS runner builds a UNIVERSAL installer (--target universal-apple-darwin) that runs
          # natively on both Apple Silicon and Intel. This replaces the earlier per-arch approach: GitHub
          # retired the macos-13 Intel image in December 2025, and all x86_64 macOS runners are removed in
          # August 2027, so a dedicated Intel runner has no future. The universal build runs on the
          # Apple-Silicon image and lipo's in the Intel slice; the bundled Node runtime and native addons
          # are made universal in a dedicated step so the one .app launches on either architecture.
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04        # oldest supported base for a wider Linux compatibility floor
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fail loudly and early if the release reference does not match the version the installers will
      # carry (package.json, which tauri.conf.json reads directly). Without this, tagging a release while
      # the version was never bumped would publish a release titled with the tag but containing installers
      # whose internal version is stale. Runs before the expensive Rust/build steps. shell: bash so the one
      # script works on the Windows runner too.
      - name: Verify the version matches the release reference
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"   # tolerate an optional leading v on the tag
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Release reference '$TAG' does not match package.json version '$PKG'. Bump the version before tagging."
            exit 1
          fi
          echo "Version $PKG matches the release reference."

      - name: Install the Rust toolchain
        run: rustup default stable

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: bash src-tauri/linux-build-deps.sh

      # Installs runtime dependencies (native modules build for this OS) plus the desktop
      # build tool. prepare-sidecar stages a production-only copy into the bundle.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # macOS ships ONE universal installer that runs natively on both Intel and Apple Silicon, built on
      # the Apple-Silicon runner (the Intel runner image is retired). Three things must be universal:
      #   1. the Rust shell — Tauri lipo's it when given --target universal-apple-darwin (set below);
      #   2. the bundled Node runtime — built here as a universal binary from both official arch tarballs,
      #      checksum-verified and proven to run, exposed via LOKYNI_RUNTIME_NODE for prepare-sidecar;
      #   3. the bundled native addons (faiss-node, @napi-rs/canvas, sharp, fsevents; onnxruntime already
      #      ships every arch) — a second x64 install is folded into the arm64 tree (lipo / arch-file copy)
      #      and then a fail-loud check proves every darwin .node works on both architectures, so a
      #      missing x64 prebuilt fails the build here rather than shipping an app that crashes on Intel.
      - name: Prepare the universal macOS runtime, native addons, and build target
        if: matrix.label == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          # Universal Node from the two official per-arch tarballs for the pinned version.
          NODE_VER="$(node -v | sed 's/^v//')"
          work="$RUNNER_TEMP/universal-node"; mkdir -p "$work"; ( cd "$work"
            base="https://nodejs.org/dist/v$NODE_VER"
            curl -fsSLO "$base/SHASUMS256.txt"
            for a in x64 arm64; do curl -fsSLO "$base/node-v$NODE_VER-darwin-$a.tar.gz"; done
            grep -E "node-v$NODE_VER-darwin-(x64|arm64)\.tar\.gz$" SHASUMS256.txt | shasum -a 256 -c -
            for a in x64 arm64; do tar -xzf "node-v$NODE_VER-darwin-$a.tar.gz"; done
            lipo -create -output universal-node "node-v$NODE_VER-darwin-arm64/bin/node" "node-v$NODE_VER-darwin-x64/bin/node"
            chmod +x universal-node
            archs="$(lipo -archs universal-node)"; echo "universal-node archs: $archs"
            echo "$archs" | grep -qw x86_64 && echo "$archs" | grep -qw arm64   # both slices present, or fail the build
            test "$(./universal-node --version)" = "v$NODE_VER" )
          echo "LOKYNI_RUNTIME_NODE=$work/universal-node" >> "$GITHUB_ENV"
          echo "LOKYNI_TAURI_TARGET=universal-apple-darwin" >> "$GITHUB_ENV"
          # Second install of the OTHER architecture's native binaries, folded into the arm64 tree so every
          # bundled .node is universal. This must let install scripts RUN (no --ignore-scripts): the native
          # addons (faiss-node, sharp) fetch their prebuilt binary through a postinstall step, and the
          # npm_config_*arch/platform env vars steer that fetch to the x64 darwin build rather than the host
          # (arm64) one. The main install above already runs scripts, so this adds no new trust surface. The
          # verify step then fails the build if any darwin .node did not end up universal.
          x64dir="$RUNNER_TEMP/x64-install"; mkdir -p "$x64dir"; cp package.json "$x64dir/"
          ( cd "$x64dir" && npm_config_arch=x64 npm_config_target_arch=x64 npm_config_platform=darwin \
              npm install --cpu=x64 --os=darwin --no-audit --no-fund )
          node src-tauri/universal-mac-natives.js merge "$x64dir/node_modules"
          node src-tauri/universal-mac-natives.js verify node_modules

      - name: Build the installers
        run: npm run tauri:build

      # Ad-hoc sign and verify the macOS app so a downloaded bundle does not report as
      # "damaged". This is not notarization (no Apple Developer ID certificate is available);
      # users may still need to right-click and choose Open on first launch.
      - name: Sign and verify the macOS app
        if: matrix.label == 'macos'
        shell: bash
        run: |
          # The universal build lands under target/universal-apple-darwin/…; search any target path.
          APP=$(find src-tauri/target -type d -path '*/release/bundle/macos/*.app' | head -n1)
          if [ -z "$APP" ]; then echo "No .app bundle found"; exit 1; fi
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Prove the shipped app really is universal (both slices in the shell and the bundled Node).
          lipo -info "$APP/Contents/MacOS/"* || true
          NODE_BIN=$(find "$APP" -type f -name node | head -n1)
          if [ -n "$NODE_BIN" ]; then lipo -archs "$NODE_BIN"; lipo -archs "$NODE_BIN" | grep -q x86_64 && lipo -archs "$NODE_BIN" | grep -q arm64 || { echo "::error::bundled Node is not universal"; exit 1; }; fi

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: lokyni-${{ matrix.label }}
          if-no-files-found: error
          # target/**/bundle covers both the host-target path (Windows/Linux) and the explicit-target
          # path (target/universal-apple-darwin/release/bundle for the macOS universal build).
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm

  # Attach the installers to a release. One job holds write access; re-runs refresh the
  # release rather than creating duplicates.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Publish or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          mapfile -t FILES < <(find installers -type f)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${FILES[@]}"
          fi
