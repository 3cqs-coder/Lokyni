# Build the Lokyni desktop app for macOS, Windows, and Linux.
#
# A branch push or pull request runs the unit suite (all three platforms). A version tag — or a manual run
# (workflow_dispatch), optionally build-only — also builds the native installers on each operating system and
# (for a tag or a non-blank tag input) attaches them to a release. The server container image is a SEPARATE
# workflow (docker.yml), and the browser (e2e) suite is another (e2e.yml), so building the desktop app does not
# drag either along.
#
# The app bundles real native modules (the vector index, the local reranker runtime, image
# handling), which cannot be cross-compiled, so each installer is built on its own operating
# system. The macOS app is Apple-Silicon (arm64) only — a bundled native ML runtime ships no Intel
# macOS binary. Dependencies are installed fresh on each runner so the bundled binaries match the
# target platform.

name: Desktop app

on:
  push:
    branches: [master, main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:                 # start a build by hand at any time
    inputs:
      release_tag:
        # The tag to build and attach the installers to (for example 1.0.0). Leave BLANK for a build-only run:
        # every platform's installers still upload as downloadable run artifacts, but no release is created or
        # changed. Enter a tag only when you intend to publish (or replace) that release's assets.
        description: 'Release tag to publish to (e.g. 1.0.0). Leave blank to build installers only, no release.'
        required: false
      build_only:
        # An explicit, unmistakable build-only switch. When checked, the release job is skipped no matter what
        # the tag says, so a run can never publish or overwrite a release by accident. The installers are still
        # built on all three platforms and uploaded as run artifacts. This overrides release_tag.
        description: 'Build the installers only — never create or update any release (overrides the tag).'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # This exact runtime is copied into the bundle, so it is pinned for reproducibility. Keep it
  # aligned with the version the app is tested against.
  NODE_VERSION: '24.11.1'

jobs:
  # Unit suite on all three platforms. Gates every build.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run the unit suite
        run: npm run test:unit

  # Build the installers. Only for a version tag or a manual run. Gated on the unit suite; the server image is
  # built and exercised in its own workflow (docker.yml), and the on-demand e2e suite is not a build gate.
  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS runner (macos-latest, Apple Silicon) builds an arm64 installer. A bundled native ML
          # runtime (onnxruntime-node) ships an arm64 macOS binary only, so a universal (Intel + Apple Silicon)
          # build is not possible with it — and Intel Macs are end-of-life with their GitHub runners retired.
          # The bundled Node and native addons come from the host install, so the .app is Apple-Silicon native.
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
          - os: ubuntu-22.04        # oldest supported base for a wider Linux compatibility floor
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fail loudly and early if the release reference does not match the version the installers will
      # carry (package.json, which tauri.conf.json reads directly). Without this, tagging a release while
      # the version was never bumped would publish a release titled with the tag but containing installers
      # whose internal version is stale. Runs before the expensive Rust/build steps. shell: bash so the one
      # script works on the Windows runner too.
      - name: Verify the version matches the release reference
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"   # tolerate an optional leading v on the tag
          if [ "${{ github.event.inputs.build_only }}" = "true" ] || [ -z "$TAG" ]; then
            echo "Build-only run (no release) — skipping the version match; installers upload as run artifacts, no release is made."
            exit 0
          fi
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Release reference '$TAG' does not match package.json version '$PKG'. Bump the version before tagging."
            exit 1
          fi
          echo "Version $PKG matches the release reference."

      - name: Install the Rust toolchain
        run: rustup default stable

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: bash src-tauri/linux-build-deps.sh

      # Installs runtime dependencies (native modules build for this OS) plus the desktop
      # build tool. prepare-sidecar stages a production-only copy into the bundle.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The macOS app is Apple-Silicon (arm64) only. A bundled native ML runtime (onnxruntime-node) ships an
      # arm64 macOS binary and NO Intel (darwin/x64) one, so a universal build is not possible with it — and an
      # Intel Mac could not run the ML stack anyway. Intel Macs are end-of-life and GitHub's Intel runners are
      # retired, so this is the only architecture worth building. macos-latest is Apple Silicon, so the host
      # target is arm64; the bundled Node and native addons come from the normal host install above. The Tauri
      # target is pinned explicitly for a stable, predictable bundle path.
      - name: Target Apple Silicon (arm64)
        if: matrix.label == 'macos'
        shell: bash
        run: |
          rustup target add aarch64-apple-darwin
          echo "LOKYNI_TAURI_TARGET=aarch64-apple-darwin" >> "$GITHUB_ENV"

      - name: Build the installers
        run: npm run tauri:build

      # Ad-hoc sign and verify the macOS app so a downloaded bundle does not report as
      # "damaged". This is not notarization (no Apple Developer ID certificate is available);
      # users may still need to right-click and choose Open on first launch.
      - name: Sign and verify the macOS app
        if: matrix.label == 'macos'
        shell: bash
        run: |
          # The arm64 build lands under target/aarch64-apple-darwin/…; search any target path.
          APP=$(find src-tauri/target -type d -path '*/release/bundle/macos/*.app' | head -n1)
          if [ -z "$APP" ]; then echo "No .app bundle found"; exit 1; fi
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Confirm the shipped app is arm64 (Apple Silicon); the bundled Node must be arm64 or it would not launch.
          lipo -info "$APP/Contents/MacOS/"* || true
          NODE_BIN=$(find "$APP" -type f -name node | head -n1)
          if [ -n "$NODE_BIN" ]; then lipo -archs "$NODE_BIN"; lipo -archs "$NODE_BIN" | grep -q arm64 || { echo "::error::bundled Node is not arm64"; exit 1; }; fi

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: lokyni-${{ matrix.label }}
          if-no-files-found: error
          # target/**/bundle covers both the host-target path (Windows/Linux) and the explicit-target
          # path (target/aarch64-apple-darwin/release/bundle for the macOS arm64 build).
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm

  # Attach the installers to a release. One job holds write access; re-runs refresh the
  # release rather than creating duplicates.
  release:
    needs: build
    # Run only when there is a release to make: a version-tag push, or a manual run with a non-blank tag. A manual
    # run with "build only" checked (or a blank tag) never reaches here, so it can't publish or overwrite a release.
    if: (github.event_name != 'workflow_dispatch' || github.event.inputs.build_only != 'true') && (startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Publish or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          mapfile -t FILES < <(find installers -type f)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${FILES[@]}"
          fi
