# Build, exercise, and publish the Lokyni server container image as a MULTI-ARCH (amd64 + arm64) image.
#
# WHY NOT QEMU: the image installs native Node addons (faiss-node for the vector index, onnxruntime-node behind the
# reranker). Building the arm64 image by emulating arm64 on an amd64 runner with QEMU is slow and unreliable for
# native addons — it stalls for many minutes and then dies. So each architecture is built on its OWN NATIVE runner
# (amd64 on ubuntu-latest, arm64 on the ubuntu-24.04-arm runner), which is fast and reliable, and a final job merges
# the two into one multi-arch manifest. This is the standard pattern for a container image with compiled native
# dependencies (an image whose dependencies are all portable JavaScript or WebAssembly would not need it).
#
# A push to a branch or a pull request only BUILDS each arch on its native runner and exercises it (starts the
# container, reaches /status, runs the healthcheck, and proves a read-only state mount fails with guidance) —
# nothing is pushed. A release tag, or a manual run with the publish box checked, pushes each arch by digest, merges
# them into a multi-arch manifest on ghcr, and adds an SBOM, SLSA provenance, and a keyless cosign signature.

name: Build container image

on:
  push:
    branches: [master, main]
    tags:
      # Keep this tag set identical to the desktop workflow's, so one version tag fires both.
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish, merge, sign, and attest the image (leave unchecked for a build-only test).'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lokyni

jobs:
  # ── Build each architecture on its OWN native runner. On a release this pushes each arch by digest (no tag yet);
  #    on a branch/PR it loads the single-arch image locally and exercises it. No QEMU anywhere. ──
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm   # GitHub's native arm64 Linux runner — no emulation
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write          # push the per-arch digest to ghcr (publish path only)
      id-token: write          # reserved for keyless signing on the publish path
    steps:
      - uses: actions/checkout@v4

      # Integrity gate (Node built-ins only, no npm install): the Docker port literals must still track
      # lib/constants.js DEFAULT_PORT, so a published image can't ship a container whose healthcheck probes a dead
      # port. Cheap, so it runs on both arch legs before anything is built.
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
      - name: Verify the Docker config has not drifted
        run: node lib/test/unit/docker-config-drift.test.js

      - name: Decide whether to publish
        id: publish
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lower-case the image name
        id: name
        run: echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ── Build-only path (branch / PR / build-only dispatch): load this arch's image and prove it works. ──
      - name: Validate the compose file
        if: steps.publish.outputs.push != 'true'
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Build this architecture and load it
        if: steps.publish.outputs.push != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: lokyni:ci

      - name: Start with a writable state volume and reach /status
        if: steps.publish.outputs.push != 'true'
        run: |
          docker run -d --name lokyni-ci \
            --tmpfs /state:size=768m,uid=1000,gid=1000 \
            --memory 2g \
            -p 127.0.0.1:17887:7887 \
            lokyni:ci
          trap 'docker rm -f lokyni-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:17887/status >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs lokyni-ci
            docker rm -f lokyni-ci
            exit 1
          fi
          docker exec lokyni-ci node /app/docker/healthcheck.js
          docker rm -f lokyni-ci

      - name: Refuse a read-only state mount with guidance
        if: steps.publish.outputs.push != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/lokyni-readonly"
          set +e
          docker run --rm --name lokyni-ro \
            -v "$RUNNER_TEMP/lokyni-readonly:/state:ro" \
            lokyni:ci > "$RUNNER_TEMP/lokyni-readonly.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/lokyni-readonly.log"
          test "$code" -ne 0
          grep -q "cannot write to its data directory" "$RUNNER_TEMP/lokyni-readonly.log"

      # ── Publish path: build this arch and push it BY DIGEST (no tag yet — the merge job assembles the tags). ──
      - name: Sign in to the container registry
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build this architecture and push by digest
        id: build
        if: steps.publish.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # Push the image with no tag, identified only by its content digest; the merge job collects the per-arch
          # digests into one tagged manifest list. name-canonical keeps the digest tied to the final image name.
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max

      - name: Export this arch's digest
        if: steps.publish.outputs.push == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload the digest
        if: steps.publish.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge the per-arch digests into ONE multi-arch manifest, then sign and attest it. Publish path only. ──
  merge:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download the per-arch digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lower-case the image name
        id: name
        run: echo "image=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          # latest=auto moves `latest` and the major.minor tag only for a STABLE release, so a pre-release tag
          # never becomes `latest` or claims the major.minor line.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Assemble the multi-arch manifest from the per-arch digests pushed above, under every derived tag.
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.name.outputs.image }}@sha256:%s ' *)

      - name: Inspect the published manifest
        run: docker buildx imagetools inspect ${{ steps.name.outputs.image }}:${{ steps.meta.outputs.version }}

      # Sign and attest the final manifest digest, keylessly. Gated to a real release tag (a permanent public
      # transparency-log record), never a manual test publish.
      - name: Capture the manifest digest
        id: digest
        run: |
          d=$(docker buildx imagetools inspect ${{ steps.name.outputs.image }}:${{ steps.meta.outputs.version }} --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$d" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Sign the manifest digest with cosign
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
